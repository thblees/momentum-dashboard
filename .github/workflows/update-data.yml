name: Update Yahoo Finance data

on:
  schedule:
    # Daily at 21:30 UTC — ~30 min after US market close
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Yahoo Finance data
        run: node scripts/fetch-yahoo.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily Yahoo Finance data update"
            git push
          fi
